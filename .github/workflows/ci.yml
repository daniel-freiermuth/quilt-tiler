name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Lint + test ───────────────────────────────────────────────
  # Same commands as `just check`: a local gate weaker than CI answers
  # "is this green?" wrongly.
  rust:
    name: Rust — lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Format
        run: cargo fmt --all --check

      # `-D warnings` is what makes the pedantic/nursery `warn` levels in
      # Cargo.toml binding; without it a finding passes as exit 0.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-nextest@0.9.145

      - name: Test
        run: cargo nextest run --workspace --profile ci

  # ── Dependencies ──────────────────────────────────────────────
  # Advisories, licenses, banned sources (deny.toml), and declared-but-
  # unused dependencies. Neither needs a build, so they run in seconds.
  deps:
    name: Dependencies — deny + machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2

      - name: cargo deny
        run: cargo deny check

      - name: cargo machete
        run: cargo machete

  # ── Line coverage ─────────────────────────────────────────────
  # A ratchet, not a target: the floor sits just under the current number
  # so an unrelated change cannot drift it downward unnoticed. Raise it
  # when coverage improves; never lower it to go green.
  #
  # Coverage says whether a line RUNS; mutation testing (mutants.yml) says
  # whether anything NOTICES when it changes. Both are needed.
  coverage:
    name: Rust — line coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-nextest@0.9.145,cargo-llvm-cov@0.6.23

      - name: Coverage
        run: cargo llvm-cov nextest --workspace --profile ci --summary-only --fail-under-lines 70
