# cargo-deny — https://embarkstudios.github.io/cargo-deny/
#
# Run locally with `cargo deny check`; CI runs the same command.

[graph]
all-features = true

[advisories]
# Every entry needs a reason and a way to retire it. Re-check on each
# dependency bump: an ignore that outlives its cause hides the next one.
ignore = [
    # bincode 1.x is unmaintained. Pulled in only transitively via
    # mlt-core -> probabilistic-collections; no maintained release of
    # either drops it yet. Retire when mlt-core stops depending on it.
    # Upstream plan: docs/MODERNIZATION-mlt-core-probabilistic-collections.md
    { id = "RUSTSEC-2025-0141", reason = "transitive via mlt-core; no upstream fix" },
]

[licenses]
# The project is GPL-3.0; everything below is compatible with it.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are `publish = false` and carry no license field.
ignore = true

[bans]
# Duplicate versions come from transitive dependencies outside our control
# (mirrors `multiple_crate_versions = "allow"` in Cargo.toml).
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
